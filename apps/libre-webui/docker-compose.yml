services:
  libre-webui:
    image: librewebui/libre-webui:0.34.1
    volumes:
      - ${APP_DATA_DIR}/data:/app/backend/data
      - ${APP_DATA_DIR}/temp:/app/backend/temp
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - PORT=3001
      - DATA_DIR=/app/backend/data
      - PLATFORM_PREFLIGHT_TMP_DIR=/app/backend/temp/preflight
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - ENABLE_SIGNUP=false
      - CORS_ORIGIN=*
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    x-runtipi:
      internal_port: 3001
      is_main: true
x-runtipi:
  schema_version: 2
